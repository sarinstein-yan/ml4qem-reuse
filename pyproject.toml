[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ml4qem-reuse"
version = "1.0.0"
description = "Maintained scientific-core implementation for ML4QEM reuse analysis"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Xianquan Yan", email = "yanx@u.nus.edu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "joblib==1.5.1",
  "matplotlib==3.10.5",
  "numpy==2.3.2",
  "openpyxl==3.1.5",
  "pyyaml==6.0.2",
  "qiskit==2.3.0",
  "qiskit-aer==0.17.2",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
]

[project.urls]
Homepage = "https://github.com/sarinstein-yan/ml4qem-reuse"
Repository = "https://github.com/sarinstein-yan/ml4qem-reuse"
Issues = "https://github.com/sarinstein-yan/ml4qem-reuse/issues"

[project.scripts]
ml4qem-reuse = "ml4qem_reuse.cli:main"

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[tool.hatch.build.targets.wheel]
packages = ["code/ml4qem_reuse"]

[tool.hatch.build.targets.sdist]
include = [
  "/code",
  "/tests",
  "/reference",
  "/patches",
  "/environments",
  "/DATA_REGISTRY.yaml",
  "/LICENSES.csv",
  "/THIRD_PARTY_NOTICES.md",
  "/REPRODUCING.md",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["code"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reference"]
